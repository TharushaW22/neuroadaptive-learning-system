[runner]
# Disable "magic" (auto-display of bare expressions); every output in app.py is explicit.
magicEnabled = false

[client]
toolbarMode = "minimal"

# Light theme only. Colours are mirrored in src/dashboard/components.py (CSS tokens).
[theme]
base = "light"
primaryColor = "#0f6b7a"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f8"
textColor = "#1f2933"
linkColor = "#0f6b7a"
borderColor = "#dde3ea"
dataframeHeaderBackgroundColor = "#f3f5f8"
showWidgetBorder = true
baseRadius = "0.5rem"
font = "sans-serif"
baseFontSize = 15
headingFontWeights = [650, 600, 600]
headingFontSizes = ["1.75rem", "1.25rem", "1.05rem"]

[theme.sidebar]
backgroundColor = "#f3f5f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2933"
borderColor = "#dde3ea"
