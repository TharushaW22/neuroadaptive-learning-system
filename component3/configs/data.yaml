# Where Component 3 keeps its copy of the data, and which Component 1 configs it reuses READ-ONLY.
stew_dir: data/raw/STEW                 # the student places sub01_lo.txt ... sub48_hi.txt + ratings.txt here
processed_dir: data/processed           # everything generated by scripts/build_data.py (git-ignored)
raw_cache: data/processed/stew_raw_cache.npz

c1_preprocess_config: preprocess.yaml   # component1/configs/preprocess.yaml (read-only)
c1_features_config: features.yaml       # only the Welch settings are used (band power for the fold trainer)
c1_deep_config: experiments/deep.yaml   # hyper-parameters for fold retraining (D1)
c1_folds_file: results/folds_5fold.json # component1/results/folds_5fold.json (read-only)
expected_config_hash: 6d7dd612          # C1's preprocessing hash; build_data.py stops if it differs

expected:
  n_epochs: 7104
  epochs_per_recording: 74
  T1_epochs: {low: 3552, high: 3552}    # from component1/docs/labels.md
  T3_epochs: {moderate: 1480, high: 1850}
