# Serves the built dashboard and forwards /api (HTTP + WebSocket) to the API container, so the
# browser only talks to one origin — the same setup as the Vite dev proxy.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/;          # trailing slash strips the /api prefix
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;             # long-lived /stream WebSockets
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
